name: Forca Android

# Forca: build the Forca APK and publish it as a GitHub Release on this fork.
# The APK has its own package (com.ykgkaira.forca), so it installs beside the official Orca app.
# Each run gets version 1.0.<run_number>. The app checks the forca-android-v* releases for updates.
on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: 'Publish the forca-android-v<version> GitHub Release'
        required: false
        default: true
        type: boolean

jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      FORCA_APP: '1'
      FORCA_VERSION: 1.0.${{ github.run_number }}
      FORCA_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build Android release APK
        run: cd android && ./gradlew assembleRelease

      # Prebuild signs the release APK with a debug key that changes on each runner.
      # Sign it again with the fixed Forca key, so that each new APK installs as an update.
      - name: Sign with the Forca key
        id: apk
        env:
          FORCA_KEYSTORE_B64: ${{ secrets.FORCA_ANDROID_KEYSTORE_B64 }}
          FORCA_KEYSTORE_PASSWORD: ${{ secrets.FORCA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/forca.p12"
          printf '%s' "$FORCA_KEYSTORE_B64" | base64 -d > "$keystore"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apks=(android/app/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "Expected one release APK, found ${#apks[@]}" >&2; exit 1; }
          out="$RUNNER_TEMP/forca-${FORCA_VERSION}.apk"
          echo "apksigner: $apksigner"
          echo "keystore bytes: $(wc -c < "$keystore")"
          echo "input APK: ${apks[0]}"
          "$apksigner" sign --verbose --ks "$keystore" --ks-type PKCS12 --ks-key-alias forca \
            --ks-pass env:FORCA_KEYSTORE_PASSWORD --key-pass env:FORCA_KEYSTORE_PASSWORD \
            --out "$out" "${apks[0]}" 2>&1
          "$apksigner" verify --print-certs "$out" 2>&1 | grep -E "Signer|DN" || true
          "$apksigner" verify "$out"
          rm -f "$keystore"
          sha256="$(sha256sum "$out" | cut -d ' ' -f 1)"
          printf '%s *%s\n' "$sha256" "$(basename "$out")" > "$out.sha256"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: forca-apk
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256

      - name: Publish GitHub Release
        if: github.event.inputs.publish_github_release != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="forca-android-v${FORCA_VERSION}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Forca Android ${FORCA_VERSION}" --prerelease \
            --notes "Forca build ${FORCA_VERSION} from ${GITHUB_SHA::10}. SHA-256: \`${{ steps.apk.outputs.sha256 }}\`" \
            "${{ steps.apk.outputs.apk }}" "${{ steps.apk.outputs.apk }}.sha256"
